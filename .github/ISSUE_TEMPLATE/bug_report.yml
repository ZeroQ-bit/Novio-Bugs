name: Bug report
description: Report a bug in Novio
body:
  - type: dropdown
    id: platform
    attributes:
      label: Novio Platform
      description: Select the Novio platform you are using
      options:
        - Apple TV / tvOS
        - Apple TV / tvOS TestFlight
        - Apple TV Simulator
    validations:
      required: true

  - type: dropdown
    id: tried_in_external_player
    attributes:
      label: Have you tried play this video in external player
      description: When reporting an issue with video playback, you should first verify if this video plays correctly and without any issues in an external player.
      options:
        - "Yes"
        - "No"
        - Not a playback issue
    validations:
      required: true

  - type: textarea
    id: describe_bug
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: Describe the issue in detail...
    validations:
      required: true

  - type: textarea
    id: to_reproduce
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Open '...'
        2. Select '...'
        3. Scroll to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: Explain what you expected to see instead...
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: App Version
      description: Open the app settings to find it or TestFlight build details.
      placeholder: v0.0.0
    validations:
      required: true

  - type: input
    id: device_info
    attributes:
      label: Device Info
      description: Open the OS settings app to find which model you have.
      placeholder: Apple TV 4K (3rd generation)
    validations:
      required: true

  - type: input
    id: os_version
    attributes:
      label: OS Version
      description: Open the OS settings app to find it or in some cases displayed in the app settings.
      placeholder: tvOS 18.4
    validations:
      required: true

  - type: input
    id: player_info
    attributes:
      label: Player Info
      description: Internal player used, if applicable.
      placeholder: KSPlayer, AVPlayer, ...

  - type: input
    id: browser_info
    attributes:
      label: Browser Info
      description: Open the about section of your browser to find the version.
      placeholder: Chrome 142, Safari 18, ...

  - type: input
    id: addon_info
    attributes:
      label: Source / Addon Involved
      description: List the installed source or addon involved, if any.
      placeholder: Cinemeta, TMDB addon, Torrentio, none

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or videos
      description: If applicable, add screenshots to help explain your problem.
      placeholder: Provide URLs or drag-and-drop images after creating the issue.

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Paste any relevant logs or error text here.
      render: shell

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Any additional information (optional)
